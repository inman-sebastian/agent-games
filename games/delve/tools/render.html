<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DELVE — render harness</title>
<style>
  html, body { margin: 0; background: #07070c; }
  #c { image-rendering: pixelated; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- Renders EXACTLY one world region through the shared modules, into a canvas sized to
     the crop — so a visual check is one tiny image of precisely the thing, captured with
     headless Chrome (no MCP). Driven entirely by URL params:
       seed  world seed (default 12345)
       c,r   centre world tile (default WIDTH/2, 100)
       w,h   region size in TILES (default 18 x 14)
       scale on-screen px per art px (default 3)
       cave  'shaft' (open centre column + chamber) | 'none' (solid rock) (default shaft)
       lamp  1 = apply the lighting system (occlusion/fog/glow) | 0 = raw lit art (default 1)
       miner 1 = draw the miner at centre | 0 (default 1)
       vision lamp reach seed (default 9)
     e.g. render.html?c=41&r=100&w=18&h=14&scale=3&cave=shaft -->
<script src="../scripts/cave-render.js"></script>
<script src="../scripts/resources.js"></script>
<script src="../resources/manifest.js"></script>
<script>DELVE_RESOURCE_FILES.forEach(function (f) { document.write('<script src="../resources/' + f + '.js"><\/script>'); });</script>
<script src="../scripts/blocks.js"></script>
<script src="../scripts/engine.js"></script>
<script src="../scripts/ore-art.js"></script>
<script src="../scripts/sprites.js"></script>
<script src="../scripts/lighting.js"></script>
<script>
(function () {
  'use strict';
  const D = window.Delve, CR = window.CaveRender, T = CR.T, W = D.WIDTH, SURF = D.SURFACE;
  CR.setStrata(D.STRATA);   // hand strata to the rock renderer
  const q = new URLSearchParams(location.search);
  const n = (k, d) => q.has(k) ? +q.get(k) : d;
  const seed = n('seed', 12345);
  const cx = n('c', W >> 1), cy = n('r', 100);
  const cols = n('w', 18), rows = n('h', 14), scale = n('scale', 3);
  const cave = q.get('cave') || 'shaft';
  const lamp = n('lamp', 1), showMiner = n('miner', 1), vision = n('vision', 9);

  const bandLeft = cx - (cols >> 1), bandTop = cy - (rows >> 1);

  // carve a cave shape into a dug set
  const dug = new Set();
  if (cave === 'shaft') {
    for (let rr = bandTop; rr <= cy; rr++) dug.add(cx + ',' + rr);            // shaft down the centre
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) dug.add((cx + dx) + ',' + (cy + dy)); // chamber
  }
  const solidTile = (c, r) => (c < 0 || c >= W) ? true : (r > SURF && !dug.has(c + ',' + r));

  // ---------- render ----------
  const LW = cols * T, LH = rows * T;
  const cv = document.getElementById('c'), g = cv.getContext('2d');
  cv.width = LW; cv.height = LH; g.imageSmoothingEnabled = false;
  cv.style.width = (LW * scale) + 'px'; cv.style.height = (LH * scale) + 'px';

  // rock + background + stalactites, at this depth
  CR.composeBand(g, solidTile, bandLeft, bandTop, cols, rows, W, SURF);

  // ore blocks (all of them — the harness always reveals ore; use lamp=0 for raw art)
  for (let r = bandTop; r < bandTop + rows; r++) for (let c = bandLeft; c < bandLeft + cols; c++) {
    if (!solidTile(c, r)) continue;
    const oid = D.blockAt(seed, c, r).ore, art = oid && DelveOre.ORE_ART[oid];
    if (!art || art.dim) continue;
    const frac = 0;
    const sameOre = (dc, dr) => solidTile(c + dc, r + dr) && D.oreAt(seed, c + dc, r + dr) === oid;
    DelveOre.drawOreBlock(g, art, (c - bandLeft) * T, (r - bandTop) * T, c, r, frac, sameOre);
  }

  if (showMiner) DelveSprites.drawMiner(g, (cx - bandLeft) * T, (cy - bandTop) * T, 'down', 0);

  // lighting: local canvas pixels are "screen" space; camY = bandTop*T maps them to world
  if (lamp) {
    const L = DelveLighting.create(), camX = bandLeft * T, camY = bandTop * T;   // world→screen offset for this crop
    L.addLight(cx * T + 8, cy * T + 8, 0, DelveLighting.LAMP_COLOR, 0.9 + 0.16 * vision);
    for (let r = bandTop; r < bandTop + rows; r++) for (let c = bandLeft; c < bandLeft + cols; c++) {
      if (!solidTile(c, r)) continue;
      const oid = D.blockAt(seed, c, r).ore, art = oid && DelveOre.ORE_ART[oid];
      if (!art || art.dim) continue;
      let nx = c, ny = r;
      if (!solidTile(c, r - 1)) ny = r - 1; else if (!solidTile(c, r + 1)) ny = r + 1;
      else if (!solidTile(c - 1, r)) nx = c - 1; else if (!solidTile(c + 1, r)) nx = c + 1;
      if (nx === c && ny === r) continue;
      const rgb = CR.hexRgb(art.c[2]);
      L.addLight(nx * T + (T >> 1), ny * T + (T >> 1), 1, [rgb[0] / 255, rgb[1] / 255, rgb[2] / 255], 0.9);
    }
    L.render({ g, LW, LH, T, camX, camY, SURFACE: -1, solidTile });
  }

  document.title = 'ready';   // signal for headless capture
})();
</script>
</body>
</html>
