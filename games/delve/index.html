<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DELVE — dig deeper</title>
<style>
  :root {
    --bg:#0b0e13; --panel:#141922; --panel2:#1b2230; --ink:#e8eef5; --dim:#7c8899;
    --gold:#f2c14e; --line:#ffffff14; --good:#77dd8f;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; }
  body {
    background:var(--bg);
    color:var(--ink); font:14px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    height:100%; -webkit-user-select:none; user-select:none; touch-action:none;
  }
  /* the game canvas fills the whole screen, edge to edge, behind the UI overlay */
  #c { position:fixed; inset:0; width:100vw; height:100vh;
    image-rendering:pixelated; image-rendering:crisp-edges; background:#0b0e13; display:block; z-index:0; }

  /* UI is an overlay floating on top of the game; only the controls take pointer input */
  .topbar { position:fixed; top:0; left:0; right:0; z-index:5; padding:10px 16px 26px;
    display:flex; flex-direction:column; gap:6px; pointer-events:none;
    background:linear-gradient(180deg, #060910d9 0%, #06091066 55%, #06091000 100%); }
  header { display:flex; align-items:center; gap:12px; justify-content:space-between; }
  h1 { font-size:13px; letter-spacing:.5em; font-weight:700; margin:0; color:var(--ink); text-shadow:0 1px 4px #000; }
  h1 b { color:var(--gold); }
  .btns { display:flex; gap:8px; pointer-events:auto; }
  button {
    font:inherit; font-weight:600; color:var(--ink); background:#1b2230cc; backdrop-filter:blur(4px);
    border:1px solid var(--line); border-radius:8px; padding:7px 11px; cursor:pointer;
    transition:.12s; }
  button:hover { border-color:#ffffff33; filter:brightness(1.15); }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.4; cursor:default; filter:none; }

  .hud {
    display:flex; gap:16px; align-items:center; font-variant-numeric:tabular-nums; flex-wrap:wrap;
    text-shadow:0 1px 4px #000, 0 0 2px #000;
  }
  .stat { color:#b9c4d2; font-size:12px; }
  .stat b { color:#fff; font-weight:700; font-size:15px; }
  .stat.coin b { color:var(--gold); }

  /* shop overlay */
  .overlay { position:fixed; inset:0; background:#070a0fcc; backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  .overlay.on { display:flex; }
  .shop { width:100%; max-width:440px; max-height:88vh; overflow:auto; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 20px 60px #000c; }
  .shop h2 { margin:0 0 2px; font-size:15px; letter-spacing:.08em; }
  .shop .sub { color:var(--dim); font-size:12px; margin-bottom:12px; }
  .row { display:flex; align-items:center; gap:12px; padding:10px; border-radius:10px;
    background:var(--panel2); margin-bottom:8px; }
  .row .info { flex:1; min-width:0; }
  .row .nm { font-weight:700; }
  .row .ds { color:var(--dim); font-size:12px; }
  .row .lv { color:var(--gold); font-size:12px; font-weight:700; }
  .row button { min-width:96px; }
  .sect { color:var(--dim); font-size:11px; letter-spacing:.14em; text-transform:uppercase; margin:12px 2px 6px; }
  .close { width:100%; margin-top:10px; }

  /* debug overlay (F3 / ?debug) */
  #dbg { position:fixed; left:10px; bottom:10px; z-index:8; display:none; white-space:pre;
    font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; color:#9fead0;
    text-shadow:0 1px 2px #000, 0 0 2px #000; pointer-events:none;
    background:#060910cc; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  #dbg.on { display:block; }
</style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="topbar">
    <header>
      <h1>DE<b>L</b>VE</h1>
      <div class="btns">
        <button id="shopBtn">⛏ Upgrades</button>
        <button id="muteBtn" title="Mute">♪</button>
        <button id="newBtn" title="New game">↺</button>
      </div>
    </header>
    <div class="hud">
      <div class="stat">DEPTH <b><span id="depth">0</span>m</b></div>
      <div class="stat coin">◈ <b id="coins">0</b></div>
      <div class="stat found">DEEPEST FIND <b id="found" style="color:var(--dim)">—</b></div>
    </div>
  </div>

  <div id="dbg"></div>

  <div class="overlay" id="overlay">
    <div class="shop">
      <h2>Upgrades</h2>
      <div class="sub">Coins: <b id="shopCoins" style="color:var(--gold)">0</b> ◈ &nbsp;·&nbsp; ore sells the instant you break it</div>
      <div id="upgrades"></div>
      <div class="sect">Technology</div>
      <div id="tech"></div>
      <button class="close" id="closeBtn">Back to the mine</button>
    </div>
  </div>

<script src="engine.js"></script>
<script src="cave-render.js"></script>
<script>
(function () {
  'use strict';
  const D = window.Delve;
  // 16px tiles drawn at logical resolution; the canvas is stretched to fill the screen
  // with image-rendering:pixelated. The field spans the full width (W columns); the
  // vertical extent (VIEW_ROWS/LH) is recomputed in fit() to match the screen aspect,
  // so tiles stay square and the canvas fills edge to edge with no letterboxing.
  const T = 16, TILE = T, W = D.WIDTH, u = 2;
  const LW = W * T;                                     // logical width = full field width (fixed)
  let VIEW_ROWS = 15, LH = VIEW_ROWS * T;
  const CHUNK = 4, MARGIN = 1;                          // rows per cached chunk; tiles of shading context around it

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  // scratch buffers: fieldBuf renders one chunk (+margin) at a time; fbuf is the fg alpha layer.
  // pen1 draws into penCtx — the scratch buffer while baking rock, the screen for per-frame veins.
  const fieldBuf = document.createElement('canvas'); fieldBuf.width = LW; fieldBuf.height = (CHUNK + 2 * MARGIN) * T;
  const lb = fieldBuf.getContext('2d'); lb.imageSmoothingEnabled = false;
  let penCtx = lb;
  const pen1 = (ax, ay, w, h, color) => { penCtx.fillStyle = color; penCtx.fillRect(ax, ay, (w || 1), (h || 1)); };

  // ---------- state / persistence ----------
  const SAVE = 'delve.save.v1';
  let s = load() || fresh();
  function fresh() { return D.newGame((Math.random() * 2 ** 31) >>> 0); }
  function load() {
    try {
      const o = JSON.parse(localStorage.getItem(SAVE));
      if (!o || !o.seed) return null;
      const base = D.newGame(o.seed);                 // fill any fields added since the save was written
      return { ...base, ...o, up: { ...base.up, ...o.up }, tech: { ...base.tech, ...o.tech } };
    } catch (e) { return null; }
  }
  function save() { try { localStorage.setItem(SAVE, JSON.stringify(s)); } catch (e) {} }
  setInterval(save, 2500);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

  // display position (lerped) & camera
  let dispC = s.c, dispR = s.r, camY = 0;

  // ---------- audio (synth) ----------
  let AC = null, muted = false, master = null;
  function audio() {
    if (AC) return AC;
    try { AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(AC.destination);
    } catch (e) {}
    return AC;
  }
  function env(node, g, a, d) { const t = AC.currentTime; node.gain.setValueAtTime(0, t);
    node.gain.linearRampToValueAtTime(g, t + a); node.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function tone(freq, a, d, type, g) {
    if (!audio() || muted) return; const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type || 'square'; o.frequency.value = freq; o.connect(gn); gn.connect(master);
    env(gn, g == null ? 0.3 : g, a, d); o.start(); o.stop(AC.currentTime + a + d + 0.02);
  }
  function noise(dur, cut, g) {
    if (!audio() || muted) return; const n = AC.createBufferSource();
    const buf = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate); const dat = buf.getChannelData(0);
    for (let i = 0; i < dat.length; i++) dat[i] = Math.random() * 2 - 1; n.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut; const gn = AC.createGain();
    n.connect(f); f.connect(gn); gn.connect(master); env(gn, g == null ? 0.4 : g, 0.002, dur); n.start();
  }
  const sfx = {
    dig(depth) { noise(0.06, 800 - Math.min(600, depth * 2), 0.18); },
    chip() { noise(0.04, 1200, 0.12); },
    break(rar) { noise(0.12, 500 + rar * 120, 0.4); },
    ore(rar) { const base = 520 + rar * 90; tone(base, 0.005, 0.14, 'triangle', 0.28);
      setTimeout(() => tone(base * 1.5, 0.005, 0.16, 'triangle', 0.22), 60); },
    sell(n) { const notes = [523, 659, 784, 1047]; for (let i = 0; i < Math.min(4, 1 + Math.floor(n / 40)); i++)
      setTimeout(() => tone(notes[i], 0.005, 0.22, 'triangle', 0.3), i * 70); },
    buy() { tone(440, 0.005, 0.09, 'square', 0.25); setTimeout(() => tone(660, 0.005, 0.12, 'square', 0.22), 70); },
  };

  // ---------- juice ----------
  let particles = [], floaties = [], shake = 0;
  const SHAKE = false;                 // screen shake disabled for now (flip to re-enable)
  // fine pixel debris: mostly 1px, shaded off the source colour (bright chip / body /
  // dark fleck) so it reads as chipped rock, not flat chunky blocks.
  function chips(cx, cy, n, col, spd) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (0.4 + Math.random()) * (spd || 40), rr = Math.random();
      const c = rr < 0.28 ? mix(col, '#fdf3d4', 0.5) : rr < 0.62 ? col : mix(col, '#0a0912', 0.4);
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20,
        life: 0.35 + Math.random() * 0.4, t: 0, col: c, sz: Math.random() < 0.8 ? 1 : 2 });
    }
  }
  function floaty(x, y, text, col, big) { floaties.push({ x, y, text, col, t: 0, life: big ? 1.4 : 0.9, big }); }

  // ---------- layered pixel-art cave renderer ----------
  // The rock (a per-pixel top-lit field, see cave-render.js) is cached as fixed-position
  // vertical CHUNKS (full field width, CHUNK rows tall). A chunk is generated once the
  // first time it scrolls into view — OFF THE MAIN THREAD via a Worker so descent never
  // stalls — and kept, so scrolling back is a cheap blit. Digging re-renders only a small
  // window around the changed tile (synchronously; cheap, no dig latency) and patches it
  // into the affected chunk(s). Chunks render with a MARGIN of context so seams are
  // invisible; fieldBuf is the main-thread scratch buffer for patches / sync fallback.
  const chunks = new Map();                 // chunkIndex -> {cv, ctx}
  const chunkOf = (r) => Math.floor(r / CHUNK);
  // debug overlay state (toggle with F3 / backtick, or start with ?debug in the URL)
  let DEBUG = /(\?|&)debug\b/.test(location.search);
  let fpsEMA = 0, frameMsEMA = 0, rebuildCount = 0, lastRebuildMs = 0;
  const motes = []; for (let i = 0; i < 10; i++) motes.push({ x: Math.random(), y: Math.random(), s: 0.3 + Math.random() });

  // rock rendering lives in the shared module (cave-render.js), used by the chunk
  // Worker too. Only the small colour helpers the per-frame overlays need are pulled in.
  const CR = window.CaveRender;
  const { mix, mulberry, hashXY, hexRgb } = CR;

  // ore art, keyed by engine ore id: crystal shape + [dark, mid, highlight] triad
  const OUT = '#0a0912';
  const ORE_ART = {
    1: { shape: 'nugget',  c: ['#48371f', '#6d5230', '#8f6b3c'], dim: true }, // Dirt clod
    2: { shape: 'nugget',  c: ['#7a3045', '#cd683d', '#f79617'] },            // Copper
    3: { shape: 'nugget',  c: ['#3e3546', '#7f708a', '#c7dcd0'] },            // Iron
    4: { shape: 'nugget',  c: ['#625565', '#9babb2', '#e8eef5'] },            // Silver
    5: { shape: 'nugget',  c: ['#4c3e24', '#f9c22b', '#fbff86'] },            // Gold
    6: { shape: 'prism',   c: ['#165a4c', '#1ebc73', '#91db69'] },            // Emerald
    7: { shape: 'cluster', c: ['#831c5d', '#f04f78', '#f68181'] },            // Ruby
    8: { shape: 'gem',     c: ['#0b8a8f', '#30e1b9', '#8ff8e2'] },            // Diamond
    9: { shape: 'shard',   c: ['#484a77', '#905ea9', '#a884f3'] },            // Mythril
  };
  // crystal shapes — all symmetric, centred, ~±(r+1) footprint (draw into the cache via pen1)
  function gem(cx, cy, r, c) { if (r < 1) r = 1;
    for (let dy = -r; dy <= r; dy++) { const w = r - Math.abs(dy); pen1(cx - w - 1, cy + dy, 1, 1, OUT); pen1(cx + w + 1, cy + dy, 1, 1, OUT); }
    pen1(cx, cy - r - 1, 1, 1, OUT); pen1(cx, cy + r + 1, 1, 1, OUT);
    for (let dy = -r; dy <= r; dy++) { const w = r - Math.abs(dy); pen1(cx - w, cy + dy, 2 * w + 1, 1, c[1]); }
    for (let dy = -r; dy <= 0; dy++) { const w = r - Math.abs(dy); pen1(cx - w, cy + dy, w + 1, 1, c[2]); }
    for (let dy = 0; dy <= r; dy++) { const w = r - Math.abs(dy); pen1(cx, cy + dy, w + 1, 1, c[0]); }
    pen1(cx - 1, cy - r + 1, 1, 1, '#ffffff'); }
  function nugget(cx, cy, r, c) { if (r < 1) r = 1; const R = r;
    let sd = 0; for (const ch of c[1]) sd = (sd * 31 + ch.charCodeAt(0)) >>> 0; const rnd = mulberry(sd || 1);
    const a1 = rnd() * 6.283, a2 = rnd() * 6.283, a3 = rnd() * 6.283;
    const rad = (dx, dy) => { const a = Math.atan2(dy, dx), up = Math.max(0, -Math.sin(a));
      return R * (1 + 0.05 * up + 0.08 * Math.sin(2 * a + a1) + 0.11 * Math.sin(3 * a + a2) + 0.07 * Math.sin(5 * a + a3)); };
    for (let dy = -r - 2; dy <= r + 2; dy++) for (let dx = -r - 2; dx <= r + 2; dx++) { if (Math.hypot(dx, dy) <= rad(dx, dy) + 1.0) pen1(cx + dx, cy + dy, 1, 1, OUT); }
    for (let dy = -r - 2; dy <= r + 2; dy++) for (let dx = -r - 2; dx <= r + 2; dx++) { if (Math.hypot(dx, dy) <= rad(dx, dy)) pen1(cx + dx, cy + dy, 1, 1, (dx + dy) < -r * 0.3 ? c[2] : (dx + dy) > r * 0.6 ? c[0] : c[1]); }
    const hx = cx - Math.round(r * 0.35), hy = cy - Math.round(r * 0.45);
    pen1(hx, hy, 1, 1, c[2]); pen1(hx + 1, hy, 1, 1, c[2]); pen1(hx, hy + 1, 1, 1, c[2]);
    pen1(hx, hy, 1, 1, '#ffffff'); pen1(hx + 1, hy, 1, 1, '#ffffff'); }
  function prism(cx, cy, r, c) { const w = r, h = r; const ww = dy => (dy < -h + 2 || dy > h - 2) ? Math.max(0, w - 2) : w;
    for (let dy = -h - 1; dy <= h + 1; dy++) { const a = ww(Math.max(-h, Math.min(h, dy))); pen1(cx - a - 1, cy + dy, 1, 1, OUT); pen1(cx + a + 1, cy + dy, 1, 1, OUT); }
    pen1(cx, cy - h - 1, 1, 1, OUT); pen1(cx, cy + h + 1, 1, 1, OUT);
    for (let dy = -h; dy <= h; dy++) { const a = ww(dy); pen1(cx - a, cy + dy, 2 * a + 1, 1, c[1]); }
    for (let dy = -h; dy <= h; dy++) { const a = ww(dy); pen1(cx - a, cy + dy, a, 1, c[2]); pen1(cx + 1, cy + dy, a, 1, c[0]); }
    pen1(cx - 1, cy - h + 1, 1, 1, '#ffffff'); }
  function shardTall(x, y, h, w, c) {
    for (let dy = -h; dy <= h; dy++) { const t = 1 - Math.abs(dy) / (h + 0.6), ww = Math.max(0, Math.round(w * t));
      pen1(x - ww - 1, y + dy, 1, 1, OUT); pen1(x + ww + 1, y + dy, 1, 1, OUT);
      pen1(x - ww, y + dy, 2 * ww + 1, 1, c[1]); pen1(x - ww, y + dy, ww, 1, c[2]); }
    pen1(x, y - h - 1, 1, 1, OUT); pen1(x, y + h + 1, 1, 1, OUT); pen1(x - 1, y - h + 1, 1, 1, '#ffffff'); }
  function shard(cx, cy, r, c) {
    shardTall(cx - (r - 1), cy, Math.max(1, r - 2), 1, c);
    shardTall(cx + (r - 1), cy, Math.max(1, r - 2), 1, c);
    shardTall(cx, cy, r, Math.max(1, r - 3), c); }
  function cluster(cx, cy, r, c) { const rs = Math.max(1, r - 2);
    gem(cx - 2, cy + 2, rs, c); gem(cx + 2, cy + 2, rs, c); gem(cx, cy - 1, Math.max(1, r - 1), c); }
  const SHAPES = { gem, nugget, prism, shard, cluster };

  // A tile is solid rock when it's below the surface, in-bounds, and not yet dug.
  // Out-of-bounds columns read as bedrock (solid) so the shaft has clean side walls.
  const solidTile = (c, r) => (c < 0 || c >= W) ? true : (r > D.SURFACE && !D.isDug(s, c, r));

  // ore vein baked into the cache: embedded flecks that chip open to a crystal.
  function drawOreVein(id, X, Y, col, row, frac) {
    const art = ORE_ART[id]; if (!art) return; const c = art.c, MAXR = 5;
    const offX = ((!solidTile(col - 1, row)) ? 1 : 0) - ((!solidTile(col + 1, row)) ? 1 : 0);
    const offY = ((!solidTile(col, row - 1)) ? 1 : 0) - ((!solidTile(col, row + 1)) ? 1 : 0);
    const OFF = 3.5, mx = (T >> 1) + offX * OFF, my = (T >> 1) + offY * OFF;
    const rnd = mulberry(hashXY(col, row, 777));
    const px = (a, b, w, h, cc) => pen1(X + a, Y + b, w, h, cc);
    const inside = (dx, dy) => dx * dx + dy * dy <= MAXR * MAXR;
    const specks = [];
    for (let t = 0; t < 40 && specks.length < 5; t++) {
      const a = rnd() * 6.283, rr = rnd() * 3, sx = Math.round(mx + Math.cos(a) * rr), sy = Math.round(my + Math.sin(a) * rr);
      if (!inside(sx - mx, sy - my)) continue;
      if (specks.some(p => Math.abs(p[0] - sx) <= 1 && Math.abs(p[1] - sy) <= 1)) continue;
      specks.push([sx, sy]); px(sx, sy, 1, 1, rnd() < 0.3 ? c[2] : c[1]);
    }
    if (frac > 0.12) { const cr = mulberry(hashXY(col, row, 9)), nc = 1 + Math.floor(frac * 3);
      for (let k = 0; k < nc; k++) { let a = cr() * 6.283, dx = Math.cos(a) * 1.5, dy = Math.sin(a) * 1.5; const steps = 2 + Math.floor(frac * 3);
        for (let stp = 0; stp < steps; stp++) { if (!inside(dx, dy)) break; px(Math.round(mx + dx), Math.round(my + dy), 1, 1, c[0]); dx += Math.cos(a); dy += Math.sin(a); } } }
    const reveal = Math.max(0, (frac - 0.35) / 0.65);
    if (reveal > 0.02) { const hole = 1 + reveal * 3;
      for (let dy = -MAXR; dy <= MAXR; dy++) for (let dx = -MAXR; dx <= MAXR; dx++) { if (!inside(dx, dy)) continue;
        const d = Math.hypot(dx, dy) - ((hashXY(col * 31 + dx, row * 17 + dy, 5) % 100) / 100) * 1.1; if (d < hole) px(mx + dx, my + dy, 1, 1, c[0]); }
      SHAPES[art.shape](X + mx, Y + my, Math.max(1, Math.round(reveal * 2.8)), c); }
  }
  // ore emits light through the unified lighting system (see addLight in the render loop),
  // not a baked glow — so a vein lights its own surroundings by the same rule as the lamp.

  // (rock field helpers distField/renderBackground/shadeRock/buildMask now live in cave-render.js)

  function drawMiner(g, X, Y, facing, bob) {
    const O = '#0a0912', H = '#e6904e', HD = '#cd683d', VIS = '#25222c', GLINT = '#8fd3ff', LAMP = '#fbff86',
          F = '#e6b98e', FD = '#c7955f', B = '#4d65b4', BD = '#323353', BL = '#4d9be6', BOOT = '#4c3e24', PK = '#9babb2', PKH = '#7a5030';
    const P = (a, b, w, h, col) => { g.fillStyle = col; g.fillRect(X + a, Y + b + bob, (w || 1), (h || 1)); };
    P(9, 3, 1, 4, PKH); P(8, 2, 4, 1, PK); P(11, 3, 1, 1, PK); P(8, 3, 1, 1, PK);
    for (const [a, b, w, h] of [[4, 1, 5, 1], [3, 2, 7, 1], [3, 3, 1, 6], [9, 3, 1, 6], [3, 9, 7, 1], [3, 9, 1, 4], [8, 9, 1, 4], [4, 13, 5, 1]]) P(a, b, w, h, O);
    P(4, 2, 5, 1, H); P(4, 3, 5, 1, H); P(4, 4, 5, 1, HD);
    const lx = facing === 'left' ? 3 : facing === 'right' ? 8 : 6; P(lx, 1, 2, 1, LAMP); P(lx, 2, 1, 1, '#f9c22b');
    P(4, 5, 5, 2, F); P(4, 7, 5, 1, FD); P(4, 5, 5, 1, VIS); P(7, 5, 1, 1, GLINT);
    P(4, 7, 5, 2, B); P(4, 8, 5, 1, BD); P(6, 7, 1, 2, BL);
    P(4, 9, 2, 3, B); P(7, 9, 2, 3, B); P(4, 12, 2, 1, BOOT); P(7, 12, 2, 1, BOOT);
  }

  const newChunkCanvas = () => { const cvc = document.createElement('canvas'); cvc.width = LW; cvc.height = CHUNK * T; return { cv: cvc, ctx: cvc.getContext('2d') }; };

  // ---- off-thread chunk generation (Worker) with a synchronous fallback ----
  let worker = null;
  const pending = new Map();         // chunkIndex -> [queued dig patches that arrived while pending]
  if (typeof Worker !== 'undefined' && typeof OffscreenCanvas !== 'undefined' && OffscreenCanvas.prototype.transferToImageBitmap) {
    try {
      worker = new Worker('chunk-worker.js');
      worker.postMessage({ type: 'init', cfg: { T, W, SURFACE: D.SURFACE, CHUNK, MARGIN } });
      worker.onmessage = (e) => {
        const { ci, bmp } = e.data;
        const queued = pending.get(ci); pending.delete(ci);
        const en = chunks.get(ci) || newChunkCanvas();

    const cx = ev.c != null ? ev.c * TILE + TILE / 2 : 0, cy = ev.c != null ? ev.r * TILE + TILE / 2 : 0;
    if (ev.type === 'move') { moving = true; }
    else if (ev.type === 'dig') {
      // tile became open → patch just the area around it into the cached chunk(s), cheaply.
      if (ev.broke) patchDig(ev.c, ev.r);
      if (!ev.broke) { sfx.chip(); chips(cx, cy, 2, '#8a7a66', 25); shake = Math.min(3, shake + 0.5); }
      else {
        const rar = ev.ore ? D.rarityOf(ev.ore) : 0;
        sfx.dig(ev.r); sfx.break(rar);
        chips(cx, cy, 5 + rar, ev.ore ? D.ORE_BY_ID[ev.ore].color : '#6b5a45', 45);
        shake = Math.min(7, shake + 1.2 + rar * 0.5 + (ev.rich ? 2 : 0));
        if (ev.ore) {                                  // ore sells instantly, in place
          sfx.ore(rar + (ev.rich ? 2 : 0)); if (ev.rich) sfx.sell(ev.coin);
          const col = ev.rich ? '#f2c14e' : D.ORE_BY_ID[ev.ore].color;
          floaty(cx, cy - 4, '+' + ev.coin + (ev.rich ? '!' : ''), col, rar >= 4 || ev.rich);
          for (let i = 0; i < 4 + rar + (ev.rich ? 8 : 0); i++) chips(cx, cy, 1, col, 55);
        }
      }
    }
  }

  function frame(now) {
    if (!last) last = now; let dt = (now - last) / 1000; last = now; if (dt > 0.1) dt = 0.1;
    const t = now / 1000;
    const workStart = performance.now();
    if (dt > 0) fpsEMA += (1 / dt - fpsEMA) * 0.1;       // smoothed frames/sec from real timestamps
    // step cadence gated by agility
    acc += dt * 1000;
    const interval = D.stats(s).interval;
    let guard = 0;
    while (acc >= interval && guard++ < 4) { acc -= interval; if (overlay.classList.contains('on')) { acc = 0; break; } step(); }

    // lerp display position toward logical grid pos
    const rate = Math.min(1, dt * 16);
    dispC += (s.c - dispC) * rate; dispR += (s.r - dispR) * rate;

    // update particles / floaties / shake
    for (const p of particles) { p.t += dt; p.vy += 120 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    particles = particles.filter(p => p.t < p.life);
    for (const f of floaties) { f.t += dt; f.y -= (f.big ? 22 : 16) * dt; }
    floaties = floaties.filter(f => f.t < f.life);
    shake *= Math.pow(0.001, dt);
    if (shake < 0.05) shake = 0;

    render(t);
    updateHUD();
    frameMsEMA += (performance.now() - workStart - frameMsEMA) * 0.1;   // smoothed per-frame compute time
    if (DEBUG) updateDebug();
    requestAnimationFrame(frame);
  }

  // ---------- debug overlay ----------
  const dbg = document.getElementById('dbg');
  dbg.classList.toggle('on', DEBUG);
  addEventListener('keydown', e => {
    if (e.code === 'F3' || e.code === 'Backquote') { DEBUG = !DEBUG; dbg.classList.toggle('on', DEBUG); e.preventDefault(); }
  });
  function updateDebug() {
    const st = D.stats(s), up = (cv.clientWidth / cv.width).toFixed(2);
    const ore = D.ORES[s.best];
    dbg.textContent =
      `DELVE · debug  (F3 to toggle)\n` +
      `fps   ${fpsEMA.toFixed(1).padStart(5)}   frame ${frameMsEMA.toFixed(2)}ms\n` +
      `pos   ${s.c},${s.r}  disp ${dispC.toFixed(1)},${dispR.toFixed(1)}  facing ${s.facing}\n` +
      `depth ${s.depth}m  best ${ore ? ore.name : '—'}\n` +
      `cam   y ${camY.toFixed(1)}  viewRows ${VIEW_ROWS}\n` +
      `canvas ${cv.width}×${cv.height} @${up}×  tile ${(cv.clientWidth / W).toFixed(1)}px  cols ${W}\n` +
      `chunks cached ${chunks.size}  renders ${rebuildCount}  last ${lastRebuildMs.toFixed(2)}ms\n` +
      `fx    particles ${particles.length}  floaties ${floaties.length}  shake ${shake.toFixed(2)}  lights ${lightCount}\n` +
      `save  dug ${Object.keys(s.dug).length}  dmg ${Object.keys(s.dmg).length}\n` +
      `econ  coins ${Math.floor(s.coins)}  earned ${s.earned}\n` +
      `stats interval ${st.interval.toFixed(0)}ms  vision ${st.vision.toFixed(1)}  value ×${st.valueMult.toFixed(1)}  fortune ${(st.fortune * 100).toFixed(0)}%\n` +
      `up    pick ${s.up.pick} · speed ${s.up.speed} · refine ${s.up.refine} · fortune ${s.up.fortune}   tech ${s.tech.scanner ? 'scanner' : '—'}/${s.tech.lantern ? 'lantern' : '—'}\n` +
      `audio ${AC ? (muted ? 'muted' : AC.state) : 'locked'}`;
  }

  // ---------- HUD / shop ----------
  const el = (id) => document.getElementById(id);
  const overlay = el('overlay');
  function updateHUD() {
    el('depth').textContent = s.depth;
    el('coins').textContent = Math.floor(s.coins).toLocaleString();
    const found = el('found'), ore = D.ORES[s.best];
    found.textContent = ore ? ore.name : '—';
    found.style.color = ore && s.best > 0 ? ore.color : 'var(--dim)';
  }

  function buildShop() {
    const uc = el('upgrades'); uc.innerHTML = '';
    for (const k in D.UPGRADES) {
      const uu = D.UPGRADES[k];
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = `<div class="info"><div class="nm">${uu.name} <span class="lv">Lv ${s.up[k]}${s.up[k]>=uu.max?' MAX':''}</span></div>
        <div class="ds">${uu.desc}</div></div><button data-up="${k}"></button>`;
      uc.appendChild(row);
    }
    const tc = el('tech'); tc.innerHTML = '';
    for (const k in D.TECH) {
      const tt = D.TECH[k];
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = `<div class="info"><div class="nm">${tt.name}</div><div class="ds">${tt.desc}</div></div>
        <button data-tech="${k}"></button>`;
      tc.appendChild(row);
    }
    uc.addEventListener('click', e => { const k = e.target.dataset.up; if (!k) return;
      if (D.buyUpgrade(s, k)) { sfx.buy(); save(); } refreshShop(); });
    tc.addEventListener('click', e => { const k = e.target.dataset.tech; if (!k) return;
      if (D.buyTech(s, k)) { sfx.buy(); save(); } refreshShop(); });
  }
  function refreshShop() {
    el('shopCoins').textContent = Math.floor(s.coins).toLocaleString();
    for (const b of el('upgrades').querySelectorAll('button')) {
      const k = b.dataset.up, uu = D.UPGRADES[k];
      b.querySelector; b.closest('.row').querySelector('.lv').textContent = 'Lv ' + s.up[k] + (s.up[k] >= uu.max ? ' MAX' : '');
      if (s.up[k] >= uu.max) { b.textContent = 'MAX'; b.disabled = true; }
      else { const c = D.upgradeCost(k, s.up[k]); b.textContent = c.toLocaleString() + ' ◈'; b.disabled = s.coins < c; }
    }
    for (const b of el('tech').querySelectorAll('button')) {
      const k = b.dataset.tech, tt = D.TECH[k];
      if (s.tech[k]) { b.textContent = 'OWNED'; b.disabled = true; }
      else { b.textContent = tt.cost.toLocaleString() + ' ◈'; b.disabled = s.coins < tt.cost; }
    }
  }
  function openShop() { audio(); for (const d in held) held[d] = false; pointerDir = null;
    refreshShop(); overlay.classList.add('on'); }
  function closeShop() { overlay.classList.remove('on'); }
  el('shopBtn').onclick = openShop; el('closeBtn').onclick = closeShop;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeShop(); });

  el('muteBtn').onclick = function () { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5;
    this.textContent = muted ? '♪̸' : '♪'; this.style.opacity = muted ? .5 : 1; };
  el('newBtn').onclick = function () {
    if (!confirm('Start a new mine? Your current progress is lost.')) return;
    s = fresh(); dispC = s.c; dispR = s.r; camY = 0; chunks.clear(); pending.clear(); save(); refreshShop();
  };

  // block scroll/zoom gestures on the game
  addEventListener('wheel', e => { if (!overlay.classList.contains('on')) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());

  // ---------- responsive sizing ----------
  // The canvas backing store is W columns wide; its height is chosen so the logical
  // aspect matches the window's — then CSS stretches it edge to edge with square,
  // pixelated tiles and no letterboxing. Vertical extent scales with the window.
  function fit() {
    const cssW = innerWidth, cssH = innerHeight;
    VIEW_ROWS = Math.max(9, Math.min(48, Math.round(W * cssH / cssW)));   // rows to match the screen aspect
    LH = VIEW_ROWS * T;
    cv.width = LW; cv.height = LH; ctx.imageSmoothingEnabled = false;      // (resetting width clears ctx state)
    cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
    // chunk cache is world-space and LW is fixed, so it survives resize — no invalidation needed.
  }
  addEventListener('resize', fit);

  // ---------- boot ----------
  buildShop(); fit(); updateHUD();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
