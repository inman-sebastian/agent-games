<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>DELVE — dig deeper</title>
    <style>
      :root {
        --bg: #0b0e13;
        --panel: #141922;
        --panel2: #1b2230;
        --ink: #e8eef5;
        --dim: #7c8899;
        --gold: #f2c14e;
        --line: #ffffff14;
        --good: #77dd8f;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.45 ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        height: 100%;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      /* the game canvas fills the whole screen, edge to edge, behind the UI overlay */
      #c {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #0b0e13;
        display: block;
        z-index: 0;
      }

      /* UI is an overlay floating on top of the game; only the controls take pointer input */
      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 5;
        padding: 10px 16px 26px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
        background: linear-gradient(180deg, #060910d9 0%, #06091066 55%, #06091000 100%);
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        justify-content: space-between;
      }
      h1 {
        font-size: 13px;
        letter-spacing: 0.5em;
        font-weight: 700;
        margin: 0;
        color: var(--ink);
        text-shadow: 0 1px 4px #000;
      }
      h1 b {
        color: var(--gold);
      }
      .btns {
        display: flex;
        gap: 8px;
        pointer-events: auto;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: var(--ink);
        background: #1b2230cc;
        backdrop-filter: blur(4px);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 11px;
        cursor: pointer;
        transition: 0.12s;
      }
      button:hover {
        border-color: #ffffff33;
        filter: brightness(1.15);
      }
      button:active {
        transform: translateY(1px);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
        filter: none;
      }

      .hud {
        display: flex;
        gap: 16px;
        align-items: center;
        font-variant-numeric: tabular-nums;
        flex-wrap: wrap;
        text-shadow:
          0 1px 4px #000,
          0 0 2px #000;
      }
      .stat {
        color: #b9c4d2;
        font-size: 12px;
      }
      .stat b {
        color: #fff;
        font-weight: 700;
        font-size: 15px;
      }

      /* inventory / collection overlay */
      .overlay {
        position: fixed;
        inset: 0;
        background: #070a0fcc;
        backdrop-filter: blur(3px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 10;
      }
      .overlay.on {
        display: flex;
      }
      .panel {
        width: 100%;
        max-width: 440px;
        max-height: 88vh;
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 20px 60px #000c;
      }
      .panel h2 {
        margin: 0 0 2px;
        font-size: 15px;
        letter-spacing: 0.08em;
      }
      .panel .sub {
        color: var(--dim);
        font-size: 12px;
        margin-bottom: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px;
        border-radius: 10px;
        background: var(--panel2);
        margin-bottom: 8px;
      }
      .row .info {
        flex: 1;
        min-width: 0;
      }
      .row .nm {
        font-weight: 700;
      }
      .row .ds {
        color: var(--dim);
        font-size: 12px;
      }
      .row .lv {
        color: var(--gold);
        font-size: 12px;
        font-weight: 700;
      }
      .row button {
        min-width: 96px;
      }
      .sect {
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin: 12px 2px 6px;
      }
      .close {
        width: 100%;
        margin-top: 10px;
      }

      /* debug overlay (F3 / ?debug) */
      #dbg {
        position: fixed;
        left: 10px;
        bottom: 10px;
        z-index: 8;
        display: none;
        white-space: pre;
        font:
          11px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: #9fead0;
        text-shadow:
          0 1px 2px #000,
          0 0 2px #000;
        pointer-events: none;
        background: #060910cc;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
      }
      #dbg.on {
        display: block;
      }
      #dbgtext {
        white-space: pre;
      }
      /* render-system toggle buttons live inside #dbg but must be clickable (the panel isn't) */
      #dbgtoggles {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 8px;
        pointer-events: auto;
      }
      .dbgbtn {
        font: inherit;
        color: #9fead0;
        background: #0b1018;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 2px 8px;
        cursor: pointer;
        opacity: 0.4;
        text-transform: capitalize;
      }
      .dbgbtn.on {
        opacity: 1;
        border-color: #3a8a63;
        color: #bfffe0;
      }

      /* on-screen movement controls (touch only; mining is aim+tap on the canvas) */
      #touch {
        display: none;
        position: fixed;
        inset: auto 0 0 0;
        z-index: 6;
        padding: 0 18px 18px;
        align-items: flex-end;
        justify-content: space-between;
        pointer-events: none;
      }
      #touch.on {
        display: flex;
      }
      .tpad {
        display: flex;
        gap: 14px;
      }
      .tbtn {
        pointer-events: auto;
        width: 66px;
        height: 66px;
        border-radius: 50%;
        font-size: 26px;
        line-height: 1;
        color: var(--ink);
        background: #1b2230bb;
        backdrop-filter: blur(4px);
        border: 1px solid var(--line);
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .tbtn:active {
        filter: brightness(1.3);
      }

      /* ore item icons (drawn from the authored crystal art) + inventory rows */
      .oreic {
        image-rendering: pixelated;
        width: 20px;
        height: 20px;
        vertical-align: middle;
      }
      .invrow {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin: 0 12px 5px 0;
        font-size: 13px;
      }
      #codexList .oreic {
        width: 26px;
        height: 26px;
      }

      /* app-state chrome (driven by <body data-app>, set by the app state machine in index.ts):
         the HUD and touch controls only exist once you've descended; the title screen shows only
         on the title state. The pause/inventory/collection panels use the manual .overlay.on toggle. */
      body[data-app='title'] .topbar,
      body[data-app='title'] #touch {
        display: none !important;
      }
      #titleOverlay {
        display: none;
      }
      body[data-app='title'] #titleOverlay {
        display: flex;
      }
      .titlepanel {
        max-width: 380px;
        text-align: center;
      }
      .wordmark {
        font-size: 44px;
        letter-spacing: 0.32em;
        padding-left: 0.32em; /* re-centre the tracked letters */
        font-weight: 700;
        margin: 4px 0 2px;
        color: var(--ink);
        text-shadow: 0 2px 12px #000;
      }
      .wordmark b {
        color: var(--gold);
      }
      .tag {
        color: var(--dim);
        font-size: 13px;
        letter-spacing: 0.1em;
        margin-bottom: 20px;
      }
      .bigbtn {
        width: 100%;
        padding: 12px;
        font-size: 15px;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>

    <div class="topbar">
      <header>
        <h1>DE<b>L</b>VE</h1>
        <div class="btns">
          <button id="invBtn">▣ Inventory</button>
          <button id="codexBtn" title="Collection">✦ Collection</button>
          <button id="muteBtn" title="Mute">♪</button>
          <button id="newBtn" title="New game">↺</button>
        </div>
      </header>
      <div class="hud">
        <div class="stat">
          DEPTH <b><span id="depth">0</span>m</b>
        </div>
        <div class="stat">HELD <b id="held">0</b></div>
      </div>
    </div>

    <div id="dbg">
      <div id="dbgtext"></div>
      <div id="dbgtoggles"></div>
    </div>

    <div id="touch">
      <div class="tpad">
        <button id="tL" class="tbtn" aria-label="Move left">◄</button>
        <button id="tR" class="tbtn" aria-label="Move right">►</button>
      </div>
      <button id="tJ" class="tbtn" aria-label="Jump">⤒</button>
    </div>

    <div class="overlay" id="overlay">
      <div class="panel">
        <h2>Inventory</h2>
        <div class="sub">Materials you've mined — <b id="invTotal">0</b> held</div>
        <div id="invList"></div>
        <button class="close" id="closeBtn">Back to the mine</button>
      </div>
    </div>

    <div class="overlay" id="codexOverlay">
      <div class="panel">
        <h2>Collection</h2>
        <div class="sub">Ores discovered on your descent</div>
        <div id="codexList"></div>
        <button class="close" id="codexClose">Back to the mine</button>
      </div>
    </div>

    <div class="overlay" id="titleOverlay">
      <div class="panel titlepanel">
        <div class="wordmark">DE<b>L</b>VE</div>
        <div class="tag">A descent into the dark. Dig deeper.</div>
        <button class="bigbtn" id="startBtn">Descend ▾</button>
      </div>
    </div>

    <div class="overlay" id="pauseOverlay">
      <div class="panel titlepanel">
        <h2>Paused</h2>
        <div class="sub">The mine waits.</div>
        <button class="bigbtn" id="resumeBtn">Resume</button>
        <button class="close" id="pauseNewBtn">Abandon &amp; start a new mine</button>
      </div>
    </div>

    <!-- The whole game is one ES-module entry (index.ts), bundled by Vite. It imports the shared
     ruleset (engine) and renderers (cave-render / ore-art / sprites / lighting); the entity
     resource files self-register via engine's import of resources/index. -->
    <script type="module" src="./src/index.ts"></script>
  </body>
</html>
