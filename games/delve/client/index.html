<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>DELVE — dig deeper</title>
    <link rel="stylesheet" href="./src/ui/ui.css" />
  </head>
  <body>
    <canvas id="c"></canvas>

    <div class="topbar">
      <header>
        <h1>DE<b>L</b>VE</h1>
        <div class="btns">
          <button id="invBtn">▣ Inventory</button>
          <button id="codexBtn" title="Collection">✦ Collection</button>
          <button id="muteBtn" title="Mute">♪</button>
          <button id="newBtn" title="New game">↺</button>
        </div>
      </header>
      <div class="hud">
        <div class="stat">
          DEPTH <b><span id="depth">0</span>m</b>
        </div>
        <div class="stat">HELD <b id="held">0</b></div>
      </div>
    </div>

    <div id="dbg">
      <div id="dbgtext"></div>
      <div id="dbgtoggles"></div>
    </div>

    <div id="touch">
      <div class="tpad">
        <button id="tL" class="tbtn" aria-label="Move left">◄</button>
        <button id="tR" class="tbtn" aria-label="Move right">►</button>
      </div>
      <button id="tJ" class="tbtn" aria-label="Jump">⤒</button>
    </div>

    <div class="overlay" id="overlay">
      <div class="panel">
        <h2>Inventory</h2>
        <div class="sub">Materials you've mined — <b id="invTotal">0</b> held</div>
        <div id="invList"></div>
        <button class="close" id="closeBtn">Back to the mine</button>
      </div>
    </div>

    <div class="overlay" id="codexOverlay">
      <div class="panel">
        <h2>Collection</h2>
        <div class="sub">Ores discovered on your descent</div>
        <div id="codexList"></div>
        <button class="close" id="codexClose">Back to the mine</button>
      </div>
    </div>

    <div class="overlay" id="titleOverlay">
      <div class="panel titlepanel">
        <div class="wordmark">DE<b>L</b>VE</div>
        <div class="tag">A descent into the dark. Dig deeper.</div>
        <button class="bigbtn" id="startBtn">Descend ▾</button>
      </div>
    </div>

    <div class="overlay" id="pauseOverlay">
      <div class="panel titlepanel">
        <h2>Paused</h2>
        <div class="sub">The mine waits.</div>
        <button class="bigbtn" id="resumeBtn">Resume</button>
        <button class="close" id="pauseNewBtn">Abandon &amp; start a new mine</button>
      </div>
    </div>

    <!-- The whole game is one ES-module entry (index.ts), bundled by Vite. It imports the shared
     ruleset (engine) and renderers (cave-render / ore-art / sprites / lighting); the entity
     resource files self-register via engine's import of resources/index. -->
    <script type="module" src="./src/index.ts"></script>
  </body>
</html>
