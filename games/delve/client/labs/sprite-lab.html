<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DELVE — sprite lab</title>
    <style>
      :root {
        --ink: #c7dcd0;
        --dim: #7f708a;
        --panel: #16141d;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07070c;
        color: var(--ink);
        font:
          12px/1.5 ui-monospace,
          monospace;
      }
      #wrap {
        display: flex;
        height: 100%;
      }
      #side {
        width: 280px;
        flex: 0 0 280px;
        overflow-y: auto;
        background: var(--panel);
        padding: 10px 12px 40px;
        box-sizing: border-box;
      }
      #stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        overflow: auto;
      }
      canvas {
        image-rendering: pixelated;
        display: block;
      }
      h2 {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
        margin: 16px 0 6px;
        border-bottom: 1px solid #ffffff14;
        padding-bottom: 4px;
      }
      h2:first-child {
        margin-top: 0;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 3px 0;
      }
      label span {
        color: var(--dim);
        flex: 1;
      }
      button {
        font: inherit;
        color: var(--ink);
        background: #232030;
        border: 1px solid #ffffff1f;
        padding: 5px 9px;
        cursor: pointer;
        text-align: left;
      }
      button:hover {
        border-color: #ffffff3d;
      }
      button[aria-pressed='true'] {
        background: #2f4a6b;
        border-color: #4d9be6;
      }
      #anims {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .hint {
        color: var(--dim);
        margin: 0;
        text-align: center;
      }
      input[type='color'] {
        width: 34px;
        height: 20px;
        padding: 0;
        border: 1px solid #ffffff1f;
        background: none;
      }
    </style>
  </head>
  <body>
    <!-- The sprite lab: every imported animation, playing, with per-layer visibility and per-layer
     recolouring. The recolour controls are the equipment pipeline in miniature — a pixel stores an
     index into its layer's ramp, so a chest piece is a palette swap and nothing else. -->
    <div id="wrap">
      <div id="side"></div>
      <div id="stage">
        <canvas id="strip"></canvas>
        <canvas id="live"></canvas>
        <p class="hint" id="readout"></p>
      </div>
    </div>
    <script type="module" src="./sprite-lab.ts"></script>
  </body>
</html>
