<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DELVE — panel lab</title>
    <!-- the game's own stylesheet; each treatment overrides only the frame -->
    <link rel="stylesheet" href="../src/ui/ui.css" />
    <style>
      body {
        overflow: auto;
        touch-action: auto;
      }
      #ground {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 0;
        image-rendering: pixelated;
        display: block;
      }
      #board {
        position: relative;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: var(--s5);
        padding: var(--s5);
      }
      .treat {
        width: 420px;
        display: flex;
        flex-direction: column;
        gap: var(--s2);
      }
      #counts,
      #slots {
        position: relative;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        gap: var(--s5);
        padding: 0 var(--s5) var(--s5);
      }
      .slotrow {
        display: flex;
        gap: var(--s2);
        padding: var(--s3);
        background: var(--c-panel);
        border: var(--frame-w) solid var(--c-edge);
        border-image: var(--frame-raised) 3 fill / var(--frame-w) / 0 repeat;
        image-rendering: pixelated;
      }
      .head .nm {
        font-family: var(--font-display);
        font-size: var(--t-label);
        color: var(--c-gold);
      }
      .head .note {
        color: var(--c-mute);
        font-size: var(--t-body);
        max-width: 400px;
      }
      /* the ONLY thing a treatment changes */
      .treat .demo {
        max-width: 400px;
        border: var(--fw) solid var(--c-edge);
        border-image: var(--frame) var(--slice) fill / var(--fw) / 0 repeat;
        image-rendering: pixelated;
        box-shadow: var(--drop);
      }
      /* rows and buttons stay flat here, so the PANEL treatment is what is being compared */
      .treat .demo-row {
        background: var(--c-void);
        border: var(--px) solid var(--c-void);
        border-image: none;
      }
      .treat .demo-btn {
        background: var(--c-edge);
        border: var(--px) solid var(--c-dim);
        border-image: none;
      }
    </style>
  </head>
  <body>
    <canvas id="ground"></canvas>
    <div id="board"></div>
    <div id="slots"></div>
    <div id="counts"></div>
    <script type="module" src="./panel-lab.ts"></script>
  </body>
</html>
