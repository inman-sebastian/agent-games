<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DELVE — character lab</title>
    <link rel="stylesheet" href="../src/ui/ui.css" />
    <style>
      /* The canvas grows with the zoom control, so the page SCROLLS and the controls sit above the
         canvas rather than below it. They were below, and at 2x the canvas pushed them off screen —
         a control legend you cannot see is worse than none, since it implies there are none. */
      body {
        overflow: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--s3);
        padding: var(--s4);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--c-void);
        padding-bottom: var(--s2);
        width: 100%;
      }
      #c {
        image-rendering: pixelated;
        display: block;
        border: var(--px) solid var(--c-edge);
      }
      #readout {
        font-family: var(--font-mono);
        font-size: var(--t-mono);
        color: var(--c-mute);
        white-space: pre-line;
        text-align: center;
        min-height: 3em;
      }
      #keys {
        font-family: var(--font-mono);
        font-size: var(--t-mono);
        color: var(--c-dim);
      }
      kbd {
        color: var(--c-ink);
        background: var(--c-edge);
        padding: 0 var(--px);
      }
    </style>
  </head>
  <body>
    <header>
      <div id="readout"></div>
      <div id="keys">
        <kbd>← →</kbd> / <kbd>A D</kbd> move &nbsp; <kbd>space</kbd> jump &nbsp; <kbd>1</kbd>–<kbd
          >4</kbd
        >
        character &nbsp; <kbd>H</kbd> hitbox &nbsp; <kbd>G</kbd> grid &nbsp; <kbd>Z</kbd> zoom
        &nbsp; <kbd>R</kbd> reset
      </div>
    </header>
    <canvas id="c"></canvas>
    <script type="module" src="./char-lab.ts"></script>
  </body>
</html>
