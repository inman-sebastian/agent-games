<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DELVE — entity rasterizer proof</title>
    <style>
      html,
      body {
        margin: 0;
        background: #07070c;
        color: #9babb2;
        font:
          12px/1.5 ui-monospace,
          monospace;
      }
      #c {
        image-rendering: pixelated;
        display: block;
      }
      p {
        margin: 8px 12px;
        max-width: 78ch;
      }
      b {
        color: #c7dcd0;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <!-- The crispness proof for issue #47. Limbs rasterized by render/entity/limb.ts, drawn INTO
     the same frame as real rock from the material pipeline, so the two are judged together rather
     than side by side from memory. URL params:
       seed   world seed (default 12345)
       r      centre world row — picks the strata palette (default 100)
       scale  on-screen px per art px (default 4)
       angles how many limb rotations to sweep (default 12)
       big    1 = limbs at the decided 2x3-tile character scale (default 0 = the old sub-tile size)
       map    1 = replace every surface with the (along, around) coordinate debug map
    Capture: tools/shot.sh 'scale=4' /tmp/entity.png labs/entity-lab.html -->
    <p>
      <b>Top row:</b> one limb swept through rotations — every angle is rasterized directly, never a
      rotated bitmap, so all of them are equally crisp. <b>Middle:</b> the same limb over real rock,
      in the strata palette for this depth. <b>Bottom:</b> rock alone, for the grain comparison.
    </p>
    <script type="module" src="./entity-lab.ts"></script>
  </body>
</html>
