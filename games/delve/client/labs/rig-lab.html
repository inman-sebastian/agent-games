<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DELVE — rig lab</title>
    <style>
      :root {
        --ink: #c7dcd0;
        --dim: #7f708a;
        --panel: #16141d;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07070c;
        color: var(--ink);
        font:
          12px/1.5 ui-monospace,
          monospace;
      }
      #wrap {
        display: flex;
        height: 100%;
      }
      #side {
        width: 300px;
        flex: 0 0 300px;
        overflow-y: auto;
        background: var(--panel);
        padding: 10px 12px 40px;
        box-sizing: border-box;
      }
      #stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        overflow: auto;
      }
      canvas {
        image-rendering: pixelated;
        display: block;
      }
      h2 {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
        margin: 16px 0 6px;
        border-bottom: 1px solid #ffffff14;
        padding-bottom: 4px;
      }
      h2:first-child {
        margin-top: 0;
      }
      label {
        display: grid;
        grid-template-columns: 96px 1fr 38px;
        align-items: center;
        gap: 6px;
        margin: 3px 0;
      }
      label span:first-child {
        color: var(--dim);
      }
      label output {
        text-align: right;
        color: #8fd3ff;
      }
      input[type='range'] {
        width: 100%;
        accent-color: #4d9be6;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        color: var(--ink);
        background: #232030;
        border: 1px solid #ffffff1f;
        padding: 5px 9px;
        cursor: pointer;
      }
      button:hover {
        border-color: #ffffff3d;
      }
      textarea {
        width: 100%;
        height: 130px;
        margin-top: 8px;
        background: #0d0c13;
        color: #91db69;
        border: 1px solid #ffffff14;
        font: 10px/1.4 ui-monospace, monospace;
        box-sizing: border-box;
      }
      .hint {
        color: var(--dim);
        margin: 6px 0 0;
      }
    </style>
  </head>
  <body>
    <!-- The rig lab: every humanoid tunable bound to a live slider, over an animating figure.
     Built because tuning the silhouette as module constants cost a code edit, a commit and a
     screenshot per guess, and that loop ran eight times in one session without converging.
     "Copy TS" emits a replacement for DEFAULT_CONFIG in render/entity/config.ts, so a dialled-in
     figure lands back in the repo instead of living in a browser tab.
     Optional: load one of the reference sheet PNGs as a ghost underlay for 1:1 comparison. -->
    <div id="wrap">
      <div id="side"></div>
      <div id="stage">
        <canvas id="strip"></canvas>
        <canvas id="live"></canvas>
        <p class="hint" id="readout"></p>
      </div>
    </div>
    <script type="module" src="./rig-lab.ts"></script>
  </body>
</html>
